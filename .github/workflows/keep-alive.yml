name: Keep SmartProp Awake

# Pings the Render health endpoint every 10 minutes so the free-tier
# service never sits idle long enough (15 min) to spin down.
# Runs entirely on GitHub's own infrastructure — no third-party
# monitoring account, no ToS to worry about.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf https://smartprop.onrender.com/api/health \
            && echo "✓ Ping succeeded" \
            || echo "✗ Ping failed (non-fatal — will retry in 10 min)"
